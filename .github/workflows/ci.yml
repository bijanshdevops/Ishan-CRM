name: CI

on:
  push:
    branches: [main, 'phase-*/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ishan
          POSTGRES_PASSWORD: ishan
          POSTGRES_DB: ishan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ishan -d ishan" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ishan:ishan@localhost:5432/ishan?schema=public
      REDIS_URL: redis://localhost:6379
      RUN_DB_TESTS: '1'
      PDF_CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Generate Prisma client and apply migrations
        run: |
          pnpm --filter @ishan/api exec prisma generate
          pnpm --filter @ishan/api exec prisma migrate deploy
      - run: pnpm typecheck
      - name: Test (posts a failure digest as a commit comment, since logs are not readable by agents)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm test 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            { echo '### Test failure digest'; echo '```'; sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -vE '^\s*$' | tail -120; echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
          else
            { echo '### tests passed (database tests enabled)'; echo '```'; sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -E '(Test Files|Tests |✓ |↓ |skipped)' | tail -80; echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
          fi
          exit $code
      - run: pnpm build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan history for secrets (posts rule/file/line as a commit comment on failure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect \
            --source /repo --no-banner --redact --exit-code 1 \
            --report-format json --report-path /repo/gitleaks.json
          code=$?
          if [ $code -ne 0 ] && [ -f gitleaks.json ]; then
            { echo '### secret scan failed'; echo '```'; \
              jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) \(.Commit[0:8])"' gitleaks.json | head -40; \
              echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
          fi
          exit $code

  migration-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ishan
          POSTGRES_PASSWORD: ishan
          POSTGRES_DB: ishan
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ishan -d ishan" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ishan:ishan@localhost:5432/ishan?schema=public
      SHADOW_DATABASE_URL: postgresql://ishan:ishan@localhost:5432/ishan_shadow?schema=public
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=ishan psql -h localhost -U ishan -d ishan -c 'CREATE DATABASE ishan_shadow'
      - name: Schema must match migrations (posts the missing SQL as a commit comment on drift)
        run: |
          set +e
          cd apps/api
          pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --script > /tmp/diff.sql 2> /tmp/diff.err
          code=$?
          if [ $code -eq 0 ] && grep -q "empty migration" /tmp/diff.sql; then echo "schema and migrations match"; exit 0; fi
          { echo '### Prisma migration drift'; echo '```sql'; cat /tmp/diff.sql; echo '```'; echo '```'; cat /tmp/diff.err; echo '```'; } > /tmp/body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
          exit 1

  supply-chain:
    name: supply-chain (SBOM + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TRIVY: aquasec/trivy:0.58.1
    steps:
      - uses: actions/checkout@v4
      - name: Build the production images
        run: |
          docker build -f apps/api/Dockerfile --target runner -t ishan-api:ci .
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=/api/v1 --build-arg API_INTERNAL_URL=http://api:4000 \
            -t ishan-web:ci .
      - name: SBOM (CycloneDX) for each image
        run: |
          mkdir -p sbom
          for img in api web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" $TRIVY \
              image --quiet --format cyclonedx --output /out/ishan-$img.cdx.json ishan-$img:ci
          done
          ls -l sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom/*.cdx.json
          retention-days: 90
      - name: Scan the images (fixable HIGH/CRITICAL fail; posts the findings as a commit comment on failure)
        run: |
          set +e
          mkdir -p scan
          fail=0
          for img in api web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" $TRIVY \
              image --quiet --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /work/.trivyignore \
              --exit-code 1 --format json --output /work/scan/$img.json ishan-$img:ci
            [ $? -ne 0 ] && fail=1
          done
          if [ $fail -ne 0 ]; then
            { echo '### Trivy found fixable HIGH/CRITICAL vulnerabilities'; echo '```'; \
              for img in api web; do jq -r --arg i $img '.Results[]? | .Target as $t | .Vulnerabilities[]? | "\($i) \(.VulnerabilityID) \(.Severity) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) \(.PkgPath // $t)"' scan/$img.json; done | sort -u | head -80; \
              echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
            # Pull-request runs cannot comment (read-only token); annotations are readable everywhere.
            echo "::error title=trivy findings::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' /tmp/body.md | cut -c1-3000)"
          fi
          exit $fail

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ github.sha }}
          path: scan/*.json
          retention-days: 30

  backup-restore:
    name: backup-restore (pg_dump round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL, run the migrations and boot the API (creates real data)
        run: docker compose -f deploy/compose.dev.yml -f deploy/compose.backup.yml up --build -d --wait --wait-timeout 420 api
      - name: Build the backup image
        run: docker compose -f deploy/compose.dev.yml -f deploy/compose.backup.yml build backup
      - name: Backup -> verify -> restore into a new database -> compare (plus failure paths)
        run: |
          docker compose -f deploy/compose.dev.yml -f deploy/compose.backup.yml run --rm --no-deps \
            -T --entrypoint selftest.sh backup
      - name: Scheduled backup service produces a verified backup
        run: |
          docker compose -f deploy/compose.dev.yml -f deploy/compose.backup.yml up -d backup
          for i in $(seq 1 30); do
            docker compose -f deploy/compose.dev.yml -f deploy/compose.backup.yml exec -T backup healthcheck.sh && break
            sleep 2
          done
          docker compose -f deploy/compose.dev.yml -f deploy/compose.backup.yml exec -T backup healthcheck.sh
          docker compose -f deploy/compose.dev.yml -f deploy/compose.backup.yml exec -T backup ls -l /backups
      - if: failure()
        run: docker compose -f deploy/compose.dev.yml -f deploy/compose.backup.yml logs --no-color --tail=80
      - if: always()
        run: docker compose -f deploy/compose.dev.yml -f deploy/compose.backup.yml down -v

  e2e:
    name: e2e (docker compose + Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ishan/contracts build && pnpm --filter @ishan/i18n build
      - name: Start the full stack (postgres, migrate, api, web)
        run: |
          set +e
          docker compose -f deploy/compose.dev.yml up --build -d --wait --wait-timeout 420 > /tmp/up.log 2>&1
          code=$?
          tail -40 /tmp/up.log
          if [ $code -ne 0 ]; then
            { echo '### docker compose up failed'; echo '```'; sed 's/\x1b\[[0-9;]*m//g' /tmp/up.log | tail -60; docker compose -f deploy/compose.dev.yml ps -a 2>&1 | tail -20; echo '---'; docker compose -f deploy/compose.dev.yml logs --no-color --tail=60 2>&1 | tail -150; echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
          fi
          exit $code
      - name: Worker exposes queue metrics (internal port)
        run: |
          docker compose -f deploy/compose.dev.yml exec -T worker wget -qO- http://127.0.0.1:4001/metrics | tee /tmp/metrics.txt
          grep -q '^ishan_worker_up 1$' /tmp/metrics.txt
          grep -q '^ishan_queue_scrape_ok 1$' /tmp/metrics.txt
          grep -q 'ishan_queue_jobs{queue="maintenance",state="waiting"}' /tmp/metrics.txt
      - run: pnpm --filter @ishan/e2e exec playwright install --with-deps chromium
      - name: Run browser tests (posts a digest on failure)
        run: |
          set +e
          pnpm --filter @ishan/e2e e2e 2>&1 | tee /tmp/e2e.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            { echo '### e2e failure digest'; echo '```'; sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log | grep -vE '^\s*$' | tail -120; echo '---api logs---'; docker compose -f deploy/compose.dev.yml logs --no-color --tail=40 api 2>&1 | tail -60; echo '---worker logs---'; docker compose -f deploy/compose.dev.yml logs --no-color --tail=60 worker 2>&1 | cut -c1-300 | tail -60; echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
            # Pull-request runs cannot comment (read-only token); annotations are readable everywhere.
            for part in e2e worker; do
              if [ $part = e2e ]; then sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log | grep -vE '^\s*$' | tail -45 > /tmp/part.txt
              else docker compose -f deploy/compose.dev.yml logs --no-color --tail=60 worker 2>&1 | cut -c1-260 | tail -30 > /tmp/part.txt; fi
              echo "::error title=e2e $part digest::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' /tmp/part.txt)"
            done
          fi
          if [ $code -eq 0 ]; then
            { echo '### e2e passed'; echo '```'; sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log | grep -vE '^\s*$' | tail -30; echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
          fi
          exit $code
      - if: always()
        run: docker compose -f deploy/compose.dev.yml down -v

  demo-stack:
    name: demo-stack (live demo)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare (secrets are random per run; the network normally comes from the website stack)
        run: |
          docker network create greenlanco_internal
          printf 'DEMO_POSTGRES_PASSWORD=%s\nDEMO_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -base64 32)" > deploy/demo.env
          # CI only: publish the web port so the smoke test can reach it.
          printf 'services:\n  web:\n    ports: ["127.0.0.1:3100:3000"]\n' > deploy/compose.demo.ci.yml
      - name: Start the demo stack
        run: |
          set +e
          docker compose -f deploy/compose.demo.yml -f deploy/compose.demo.ci.yml --env-file deploy/demo.env up --build -d --wait --wait-timeout 480 > /tmp/up.log 2>&1
          code=$?
          tail -30 /tmp/up.log
          if [ $code -ne 0 ]; then
            { echo '### demo stack failed to start'; echo '```'; sed 's/\x1b\[[0-9;]*m//g' /tmp/up.log | tail -40; docker compose -f deploy/compose.demo.yml --env-file deploy/demo.env logs --no-color --tail=60 2>&1 | cut -c1-300 | tail -150; echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
          fi
          exit $code
      - name: Smoke test (auto-login, restricted role, free writes, reset)
        run: |
          set +e
          sh deploy/demo/smoke.sh http://127.0.0.1:3100 2>&1 | tee /tmp/smoke.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            { echo '### demo smoke test failed'; echo '```'; tail -30 /tmp/smoke.log; echo '---api---'; docker compose -f deploy/compose.demo.yml --env-file deploy/demo.env logs --no-color --tail=40 api reset 2>&1 | cut -c1-300 | tail -80; echo '```'; } > /tmp/body.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md > /dev/null
            echo "::error title=demo smoke::$(tail -8 /tmp/smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          exit $code
      - if: always()
        run: docker compose -f deploy/compose.demo.yml -f deploy/compose.demo.ci.yml --env-file deploy/demo.env down -v

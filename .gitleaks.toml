title = "Ishan CRM gitleaks"

[extend]
useDefault = true

# Dev-only compose secrets and test fixtures are deliberate and public.
# Real secrets never belong in these files; production reads them from the environment.
[allowlist]
description = "Dev compose placeholders and e2e test fixtures"
paths = [
  '''deploy/compose\.dev\.yml''',
  '''apps/api/test/.*\.spec\.ts''',
]
# The two public development values that production refuses to boot with (ADR 0023);
# apps/api/src/config.ts must name them to reject them.
regexes = [
  '''ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=''',
  '''ChangeMe-Dev-2026!''',
]
